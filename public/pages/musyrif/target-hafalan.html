<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Target Hafalan - Sistem Monitoring Hafalan</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📖</text></svg>">
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="main">
      <header class="topbar" id="topbar"></header>
      <div class="content">
        <div class="card">
          <div class="card-header wrap">
            <h3>🎯 Target Hafalan Santri Binaan</h3>
            <button class="btn btn-primary btn-sm" onclick="openTargetForm()">🎯 Buat Target</button>
          </div>
          <div class="table-wrap"><table id="targetListTable"></table></div>
        </div>
      </div>
      <footer class="app-footer">© 2026 Sistem Monitoring Hafalan - Pesantren Tahfidz</footer>
    </div>
  </div>

  <!-- MODAL TARGET -->
  <div class="modal-overlay" id="modalTarget">
    <div class="modal">
      <h3>🎯 Buat Target Hafalan</h3>
      <div class="field"><label>Santri</label><select id="f_target_santri"></select></div>
      <div class="field"><label>Target Juz (periode ini)</label><input id="f_target_juz" type="number" value="1" min="1" max="30"></div>
      <div class="field"><label>Periode <span class="muted">(opsional)</span></label><input id="f_target_periode" placeholder="Contoh: 2025-2026 Semester Ganjil"></div>
      <div class="grid grid-2">
        <div class="field"><label>Mulai</label><input id="f_target_mulai" type="date"></div>
        <div class="field"><label>Selesai</label><input id="f_target_selesai" type="date"></div>
      </div>
      <div class="modal-actions">
        <button class="btn btn-ghost" onclick="closeModal('modalTarget')">Batal</button>
        <button class="btn btn-primary" onclick="saveTarget()">Simpan</button>
      </div>
    </div>
  </div>

  <div class="notice" id="toastBox"></div>
  <script src="/js/app.js"></script>
  <script src="/js/musyrif.js"></script>
</body>
</html>
