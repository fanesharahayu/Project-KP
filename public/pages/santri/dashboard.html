<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Santri - Sistem Monitoring Hafalan</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📖</text></svg>">
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="main">
      <header class="topbar" id="topbar"></header>
      <div class="content">
        <div id="statsGrid" class="grid grid-4"></div>

        <div class="card mt-3">
          <h3 class="card-title">🎯 Progres Hafalan Anda</h3>
          <div class="progress-wrap">
            <div class="progress-label">
              <span id="pText">0%</span>
              <span id="pJuzText">0 / 0 juz</span>
            </div>
            <div class="progress-track" style="height:16px;"><div class="progress-fill" id="pBar" style="width:0%"></div></div>
          </div>
          <p class="muted" id="pHint"></p>
        </div>

        <div class="card mt-3">
          <h3 class="card-title">📈 Grafik Perkembangan Hafalan</h3>
          <div class="chart-box" id="chartBox"></div>
        </div>

        <div class="card mt-3">
          <h3 class="card-title">🎯 Target Hafalan</h3>
          <div class="table-wrap"><table id="targetTable"></table></div>
        </div>

        <div class="card mt-3">
          <h3 class="card-title">📝 Riwayat Setoran Hafalan</h3>
          <div class="table-wrap"><table id="setoranTable"></table></div>
        </div>
      </div>
      <footer class="app-footer">© 2026 Sistem Monitoring Hafalan - Pesantren Tahfidz</footer>
    </div>
  </div>

  <div class="notice" id="toastBox"></div>
  <script src="/js/app.js"></script>
  <script src="/js/santri.js"></script>
</body>
</html>
