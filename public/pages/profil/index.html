<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profil - Sistem Monitoring Hafalan</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📖</text></svg>">
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="main">
      <header class="topbar" id="topbar"></header>
      <div class="content">
        <div class="card" style="max-width:560px; margin:0 auto;">
          <div style="text-align:center; margin-bottom:24px;">
            <div style="width:84px;height:84px;border-radius:50%;background:linear-gradient(135deg,var(--emerald),var(--emerald-light));color:#fff;font-size:38px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;" id="pAvatar">?</div>
            <h2 style="margin-top:14px;" id="pNama">-</h2>
            <p class="muted" id="pRole">-</p>
          </div>
          <div class="table-wrap">
            <table>
              <tbody>
                <tr><th style="width:160px;">Username</th><td id="pUsername">-</td></tr>
                <tr><th>Email</th><td id="pEmail">-</td></tr>
                <tr id="rowNis" class="hidden"><th>NIS</th><td id="pNis">-</td></tr>
                <tr id="rowKelas" class="hidden"><th>Kelas</th><td id="pKelas">-</td></tr>
                <tr id="rowMusyrif" class="hidden"><th>Musyrif</th><td id="pMusyrif">-</td></tr>
                <tr id="rowTarget" class="hidden"><th>Target Juz</th><td id="pTarget">-</td></tr>
                <tr id="rowSpesialisasi" class="hidden"><th>Spesialisasi</th><td id="pSpesialisasi">-</td></tr>
              </tbody>
            </table>
          </div>
          <div style="display:flex; gap:10px; margin-top:24px;">
            <a href="#" onclick="doLogout(event)" class="btn btn-danger btn-block" style="width:100%;">⏻ Keluar dari Aplikasi</a>
          </div>
        </div>

        <div class="card" style="max-width:560px; margin:24px auto 0;">
          <h3 style="margin-bottom:4px;">🔑 Ganti Password</h3>
          <p class="muted" style="margin-bottom:16px;">Login pertama pakai password sementara dari admin (dikirim via WA), lalu ganti di sini.</p>
          <div class="alert alert-error" id="passAlert" style="display:none;"></div>
          <form id="passForm">
            <div class="field">
              <label>Password lama (sementara dari admin)</label>
              <input type="password" id="oldPassword" autocomplete="current-password" required>
            </div>
            <div class="field">
              <label>Password baru (min. 6 karakter)</label>
              <input type="password" id="newPassword" minlength="6" autocomplete="new-password" required>
            </div>
            <div class="field">
              <label>Ulangi password baru</label>
              <input type="password" id="confirmPassword" minlength="6" autocomplete="new-password" required>
            </div>
            <button type="submit" class="btn btn-primary btn-block">Simpan Password Baru</button>
          </form>
        </div>
      </div>
      <footer class="app-footer">© 2026 Sistem Monitoring Hafalan - Pesantren Tahfidz</footer>
    </div>
  </div>

  <div class="notice" id="toastBox"></div>
  <script src="/js/app.js"></script>
  <script src="/js/profil.js"></script>
</body>
</html>
